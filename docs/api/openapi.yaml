openapi: 3.1.0
info:
  title: Payrekha gateway
  version: 0.1.0-alpha.0
  description: Payout firewall. Amounts are integer paise; times are epoch ms. Beneficiaries are hb1_ keyed hashes.
  license: { name: Apache-2.0 }
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey: { type: http, scheme: bearer, description: "API key (PAYREKHA_API_KEYS); its origin and id are trusted, not the body. Keys may be role-scoped: evaluate → POST /v1/evaluate, intents → POST /v1/intents, outcomes → POST /v1/outcomes, read → GET /v1/state and /metrics. Absent roles = all." }
    adminKey: { type: http, scheme: bearer, description: "Separate admin token (PAYREKHA_ADMIN_KEY)" }
  schemas:
    Kind: { type: string, enum: [LOAN_DISBURSAL, PA_SETTLEMENT, REFUND, VDA_WITHDRAWAL, VENDOR_PAYOUT, VERIFICATION] }
    Beneficiary:
      type: object
      description: Raw identifiers, hashed at the gateway and never stored or logged
      properties: { account: { type: string }, ifsc: { type: string }, vpa: { type: string }, mobile: { type: string } }
    Intent:
      type: object
      required: [intentId, kind, maxAmountPaise, beneficiaryRef, maxUses, notBeforeMs, expiresAtMs, issuer, keyId, signature]
      properties:
        intentId: { type: string }
        kind: { $ref: '#/components/schemas/Kind' }
        maxAmountPaise: { type: integer, minimum: 1 }
        beneficiaryRef: { type: string, pattern: '^hb1_' }
        subjectRef: { type: string }
        maxUses: { type: integer, minimum: 1 }
        notBeforeMs: { type: integer }
        expiresAtMs: { type: integer }
        issuer: { type: string }
        keyId: { type: string }
        signature: { type: string, description: "base64url Ed25519 or HMAC-SHA256 over 'payrekha-intent-v1\\n' + canonical JSON" }
    Payout:
      type: object
      required: [payoutId, kind, amountPaise]
      properties:
        payoutId: { type: string, description: Retries with the same id get the same verdict }
        kind: { $ref: '#/components/schemas/Kind' }
        amountPaise: { type: integer, minimum: 1 }
        intentId: { type: string }
        beneficiaryRef: { type: string, pattern: '^hb1_' }
        beneficiary: { $ref: '#/components/schemas/Beneficiary' }
        channel: { type: string, enum: [IMPS, NEFT, RTGS, UPI, INTERNAL, CRYPTO] }
        merchantId: { type: string }
        clientAttested: { type: boolean }
        timestampMs:
          type: integer
          description: "The gateway stamps server time over this; the caller's value is kept as clientTimestampMs evidence only. A claim outside firewall.maxTimestampSkewMs degrades the verdict to REVIEW (time.skew)."
    RuleHit:
      type: object
      properties: { rule: { type: string }, verdict: { type: string, enum: [ALLOW, REVIEW, BLOCK] }, reason: { type: string }, evidence: { type: object } }
    Verdict:
      type: object
      properties:
        decisionId: { type: string }
        payoutId: { type: string }
        verdict: { type: string, enum: [ALLOW, REVIEW, BLOCK] }
        effectiveAction: { type: string, enum: [ALLOW, HOLD, DECLINE] }
        mode: { type: string, enum: [shadow, advise, enforce] }
        alertState: { type: string, enum: [NORMAL, HOLIDAY, HIGH_ALERT] }
        degraded: { type: boolean, description: Malformed input or a rule error; never a silent ALLOW }
        deduped: { type: boolean }
        hits: { type: array, items: { $ref: '#/components/schemas/RuleHit' } }
        ruleErrors: { type: array, items: { type: object } }
        elapsedMicros: { type: number }
    Error:
      type: object
      properties: { error: { type: string }, requestId: { type: string } }
  responses:
    Unauthorized: { description: Missing or wrong bearer token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
paths:
  /v1/intents:
    post:
      summary: Register signed intents (requires the intents role). Accepts one object or an array.
      requestBody: { required: true, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Intent' }, { type: array, items: { $ref: '#/components/schemas/Intent' } }] } } } }
      responses:
        '201': { description: "Every intent accepted (single object returns {accepted, reason}; an array returns {results:[...]})", content: { application/json: { schema: { oneOf: [{ type: object, properties: { accepted: { type: boolean }, reason: { type: string } } }, { type: object, properties: { results: { type: array, items: { type: object, properties: { accepted: { type: boolean }, reason: { type: string } } } } } } }] } } }
        '207': { description: Some intents accepted; rejected ids are tombstoned }
        '422': { description: Every intent rejected }
        '429': { description: "Key's per-minute verification budget spent (intentVerificationsPerMinute, default 5000)" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Key lacks the intents role }
  /v1/evaluate:
    post:
      summary: Evaluate a payout (requires the evaluate role)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Payout' } } } }
      responses:
        '200': { description: Verdict (always 200; act on effectiveAction), content: { application/json: { schema: { $ref: '#/components/schemas/Verdict' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Key lacks the evaluate role }
  /v1/outcomes:
    post:
      summary: "Report what happened to a payout: settled, failed or reversed (requires the outcomes role). failed/reversed refund the intent use, so only the key that evaluated the payout may report on it."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [payoutId, outcome], properties: { payoutId: { type: string }, outcome: { type: string, enum: [settled, failed, reversed] } } } } } }
      responses:
        '200': { description: "known=false when the payoutId is unknown or was evaluated by a different key (the denial is audited)", content: { application/json: { schema: { type: object, properties: { payoutId: { type: string }, known: { type: boolean } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Key lacks the outcomes role }
  /v1/state:
    get:
      summary: Mode, alert state and rule list (requires the read role)
      responses: { '200': { description: State view }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { description: Key lacks the read role } }
    put:
      summary: Change mode, raise or reset HIGH_ALERT (admin, reason required)
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { mode: { type: string, enum: [shadow, advise, enforce] }, kind: { $ref: '#/components/schemas/Kind' }, highAlert: { type: string, enum: [raise, reset] }, actor: { type: string }, reason: { type: string } } } } }
      responses: { '200': { description: New state view }, '400': { description: No reason given }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/canaries:
    post:
      summary: Plant canary beneficiaries, API key ids or intent ids (admin)
      security: [{ adminKey: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { beneficiaryRefs: { type: array, items: { type: string } }, beneficiaries: { type: array, items: { $ref: '#/components/schemas/Beneficiary' } }, sourceKeyIds: { type: array, items: { type: string } }, intentIds: { type: array, items: { type: string } }, reason: { type: string } } } } }
      responses: { '201': { description: Number added }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/issuers/{keyId}:
    delete:
      summary: Revoke an issuer signing key at runtime (admin, reason required). Every intent it signed fails verification from the next evaluation; the revocation persists in the state snapshot. Rotate by adding a new keyId to config — a revoked keyId must never be reused.
      security: [{ adminKey: [] }]
      parameters: [{ name: keyId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { actor: { type: string }, reason: { type: string } } } } }
      responses:
        '200': { description: "Revoked; body includes the issuer list", content: { application/json: { schema: { type: object, properties: { keyId: { type: string }, revoked: { type: boolean }, issuers: { type: array, items: { type: object } } } } } } }
        '400': { description: No reason given }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown keyId }
  /ext_authz/{path}:
    post:
      summary: Envoy ext_authz check (HTTP service). The forwarded request is mapped with extAuthz.mapping.
      parameters: [{ name: path, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Allowed (always in shadow); headers x-payrekha-verdict, x-payrekha-action, x-payrekha-decision-id, x-payrekha-rules }
        '403': { description: HOLD or DECLINE in enforce }
  /healthz: { get: { security: [], summary: Liveness, responses: { '200': { description: OK } } } }
  /readyz: { get: { security: [], summary: Readiness (503 if the state file could not be loaded), responses: { '200': { description: Ready }, '503': { description: Not ready } } } }
  /metrics: { get: { summary: "Prometheus metrics (requires the read role)", responses: { '200': { description: text/plain exposition }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { description: Key lacks the read role } } } }
