[project]
name = "payrekha"
version = "0.1.0a2"
description = "Sign PayRekha payout intents from your LOS/LMS or settlement engine."
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ed25519 = ["cryptography>=42"]

[project.urls]
Homepage = "https://peopleofproduct.github.io/payrekha/"
Repository = "https://github.com/peopleofproduct/payrekha"
Issues = "https://github.com/peopleofproduct/payrekha/issues"
Changelog = "https://github.com/peopleofproduct/payrekha/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
