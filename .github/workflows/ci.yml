name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-pg-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PAYREKHA_TEST_PG_URL: postgres://postgres:ci-pg-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with coverage gate (85% lines / 75% branches / 80% functions)
        run: npm run test:coverage
      - name: Zero runtime dependencies in core and rules
        run: npm run check:deps
      - name: OpenAPI documents exactly the routes the server serves
        run: npm run check:openapi
      - name: Demo smoke (keeps README output honest)
        run: npm run demo
      - name: Replay smoke on the synthetic month
        run: |
          mkdir -p ci-out
          node packages/replay/dist/cli.js --payouts examples/data/payouts.csv --intents examples/data/intents.csv --config examples/data/payrekha.json --out ci-out
          test -s ci-out/report.html && test -s ci-out/report.json
      - name: No raw beneficiary identifiers in the decision log
        env:
          CI_API_TOKEN: ci-api-token-0123456789
        run: |
          mkdir -p ci-tmp
          PAYREKHA_API_KEYS=ci:prod:$CI_API_TOKEN PAYREKHA_HASH_KEY=ci-hash-key-0123456789 \
          PAYREKHA_DECISION_LOG=ci-tmp/decisions.jsonl PORT=18080 node examples/reference-gateway.mjs &
          sleep 2
          curl -sf -XPOST localhost:18080/v1/evaluate -H "authorization: Bearer $CI_API_TOKEN" \
            -d '{"payoutId":"ci-1","kind":"REFUND","amountPaise":100000,"beneficiary":{"account":"000123456789","ifsc":"HDFC0001234"},"channel":"IMPS"}' > /dev/null
          sleep 1
          test -s ci-tmp/decisions.jsonl
          ! grep -E '000123456789|HDFC0001234' ci-tmp/decisions.jsonl

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      # Budget is 5× the 1 ms target: shared runners are noisy; this catches bad regressions, not jitter.
      - run: node benchmarks/run.mjs --payouts=100000 --http=1000 --budget-us=5000

  java-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: 17
      - run: sh clients/java/build.sh

  python-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - run: cd clients/python && python -m unittest discover -s tests -v

  go-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.22'
      - run: cd clients/go && test -z "$(gofmt -l .)" && go vet ./... && go test ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: docker compose -f deploy/docker-compose.yml config -q
      - run: docker build -f deploy/Dockerfile -t payrekha:ci .
      - name: Non-root, read-only root filesystem, answers /readyz
        run: |
          docker run -d --name pr --read-only --cap-drop ALL -p 18080:8080 \
            -e PAYREKHA_API_KEYS=ci:prod:ci-api-token-0123456789 payrekha:ci
          sleep 3
          test "$(docker exec pr id -u)" != "0"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:18080/readyz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -XPOST localhost:18080/v1/evaluate)" = "401"
          docker rm -f pr

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: v3.16.3
      - run: helm lint deploy/helm/payrekha && helm lint deploy/helm/payrekha --set state.type=postgres
      - run: helm template t deploy/helm/payrekha > /dev/null
      - name: Rejects two writers on one volume
        run: "! helm template t deploy/helm/payrekha --set replicaCount=2"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner -v
