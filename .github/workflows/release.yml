name: release

# Tag v* to publish. Run manually with dry-run=true to produce the SBOM,
# image signature and provenance without publishing to npm.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, sign and attest, but do not publish to npm
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - name: Publish @payrekha/* with provenance
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: npm publish --workspaces --provenance --access public --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: npm publish --workspaces --provenance --access public --tag alpha --dry-run

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name == 'main' && 'edge' || github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, GitHub OIDC)
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
      - name: CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: payrekha-sbom.cdx.json
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attach SBOM to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: payrekha-sbom.cdx.json
          prerelease: true
