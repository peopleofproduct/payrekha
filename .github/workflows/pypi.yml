name: pypi

# Tag v* to publish the Python client. Uses PyPI trusted publishing
# (OIDC) — no API token lives in this repository. One-time setup:
# PyPI → Account → Publishing → pending publisher: project `payrekha`,
# owner `peopleofproduct`, repo `payrekha`, workflow `pypi.yml`,
# environment `pypi`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/payrekha
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet build
          python -m build clients/python
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: clients/python/dist/
