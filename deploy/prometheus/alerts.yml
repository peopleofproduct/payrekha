groups:
  - name: payrekha
    rules:
      - alert: PayrekhaDown
        expr: up{job="payrekha"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "PayRekha gateway unreachable — payouts follow your fail mode" }
      - alert: PayrekhaNotReady
        expr: payrekha_ready == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Gateway up but serving 503 — state store unreadable or fenced by another writer. Fail-closed by design; do not restart blindly." }
      - alert: PayrekhaStateSaveErrors
        expr: increase(payrekha_state_save_errors_total[10m]) > 0
        labels: { severity: critical }
        annotations: { summary: "State snapshots failing — intent uses, ledgers and HIGH_ALERT may be lost on restart" }
      - alert: PayrekhaDecisionLogErrors
        expr: increase(payrekha_decision_log_errors_total[10m]) > 0
        labels: { severity: warning }
        annotations: { summary: "Decision-log writes failing — audit trail gap; check disk/permissions" }
      - alert: PayrekhaHighAlert
        expr: payrekha_high_alert == 1
        labels: { severity: critical }
        annotations: { summary: "HIGH_ALERT active — a canary was touched or blocks burst. Investigate before reset." }
      - alert: PayrekhaRuleError
        expr: increase(payrekha_rule_errors_total[10m]) > 0
        labels: { severity: critical }
        annotations: { summary: "A rule is throwing — verdicts are degraded" }
      - alert: PayrekhaWebhookDropped
        expr: increase(payrekha_webhooks_total{result="dropped"}[5m]) > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'Webhook queue is dropping notifications — a BLOCK alert may never reach the SOAR/SIEM webhook consumer' }
      - alert: PayrekhaBlocks
        expr: increase(payrekha_verdicts_total{verdict="BLOCK"}[5m]) > 0
        labels: { severity: warning }
        annotations: { summary: "PayRekha calculated BLOCK verdicts in the last 5 minutes" }
