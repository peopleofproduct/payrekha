# Envoy in front of an existing payout API — SHADOW posture for the weekend kit.
#
# TWO EDITS REQUIRED:
#   1) payout_api cluster at the bottom → point at YOUR payout service host:port
#      (a container name on this compose network, or a routable IP/DNS name —
#      for a host-machine service use host.docker.internal:PORT).
#   2) headers_to_add → x-payrekha-key must equal PAYREKHA_EXT_AUTHZ_KEY in .env,
#      and x-client-id should name the trusted caller identity Envoy asserts
#      (your payout service id — never forward a client-supplied value).
#
# failure_mode_allow: true — if PayRekha is unreachable or crashes, payouts
# pass through untouched. Non-negotiable for a shadow pilot: the kit can
# observe but can never be the reason a payout fails.
static_resources:
  listeners:
    - name: payouts
      address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: payouts
                route_config:
                  virtual_hosts:
                    - name: payouts
                      domains: ["*"]
                      routes:
                        # EDIT: match your payout endpoint paths. Everything
                        # matched is checked; everything else passes through.
                        - match: { prefix: "/payouts" }
                          route: { cluster: payout_api }
                        - match: { prefix: "/" }
                          route: { cluster: payout_api }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: true
                      with_request_body: { max_request_bytes: 65536, allow_partial_message: false }
                      http_service:
                        server_uri: { uri: payrekha:8080, cluster: payrekha, timeout: 0.25s }
                        path_prefix: /ext_authz
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - { exact: x-payrekha-intent }
                              - { exact: x-payout-kind }
                              - { exact: x-request-id }
                              - { exact: x-risk-score }
                              - { exact: x-risk-verdict }
                              - { exact: x-risk-source }
                          headers_to_add:
                            - { key: x-payrekha-key, value: REPLACE_WITH_PAYREKHA_EXT_AUTHZ_KEY }
                            - { key: x-client-id, value: payout-service }
                            - { key: x-payrekha-origin, value: prod }
                        authorization_response:
                          allowed_upstream_headers:
                            patterns: [{ prefix: x-payrekha- }]
                          allowed_client_headers:
                            patterns: [{ prefix: x-payrekha- }]
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: payrekha
      type: STRICT_DNS
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: payrekha
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: payrekha, port_value: 8080 } } } }] }]
    - name: payout_api
      type: STRICT_DNS
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: payout_api
        # EDIT: your payout service. host.docker.internal:PORT for a service on
        # the host, container-name:PORT for another compose service.
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: payout-api, port_value: 9000 } } } }] }]
