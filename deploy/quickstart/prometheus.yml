global: { scrape_interval: 15s }
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: payrekha
    # EDIT: paste the PAYREKHA_READ_KEY value from .env (the read-role key).
    authorization: { credentials: REPLACE_WITH_READ_KEY }
    static_configs: [{ targets: ['payrekha:8080'] }]
