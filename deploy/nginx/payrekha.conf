#
# PayRekha behind stock NGINX via auth_request — mirrors the Envoy ext_authz
# pattern. Every POST /payouts triggers a subrequest to /ext_authz; PayRekha
# answers 200 (proceed to upstream) or 403 (deny).
#
# IMPORTANT — what this recipe carries:
#   auth_request subrequests are header-only in stock nginx. The payout
#   service asserts intent/kind/amount in headers PayRekha's mapping reads
#   (x-payrekha-intent, x-payout-kind, x-payout-amount, x-payout-id,
#   x-beneficiary-ref). If your payout service can't assert headers, use the
#   OpenResty Lua recipe at the bottom (full body forwarding) or the Envoy
#   sidecar which forwards bodies natively.

upstream payrekha    { server payrekha:8080; keepalive 32; }
upstream payout_api  { server payout-api:9000; keepalive 32; }

server {
  listen 8080;

  location /payouts {
    auth_request /_payrekha_auth;
    # Reject if the auth service is unreachable — same posture as Envoy's
    # failure_mode_allow: false. Pair with a client-side hold-above fallback.
    auth_request_set $payrekha_decision $upstream_http_x_payrekha_decision_id;
    auth_request_set $payrekha_action   $upstream_http_x_payrekha_action;

    # Surface the decision id to the payout service for its own ledger join.
    proxy_set_header x-payrekha-decision-id $payrekha_decision;
    proxy_set_header x-client-id demo-payout-api;   # asserted, not forwarded
    proxy_pass http://payout_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location = /_payrekha_auth {
    internal;
    proxy_method POST;
    proxy_pass http://payrekha/ext_authz/payouts;
    proxy_pass_request_body off;              # headers only — see header note
    proxy_set_header Content-Length "";
    proxy_set_header x-payrekha-key ${PAYREKHA_EXT_AUTHZ_KEY};  # env → nginx -e or template
    proxy_set_header x-client-id demo-payout-api;
    # Forward the payout-service-asserted fields PayRekha maps:
    proxy_set_header x-payrekha-intent  $http_x_payrekha_intent;
    proxy_set_header x-payout-kind      $http_x_payout_kind;
    proxy_set_header x-payout-amount    $http_x_payout_amount;
    proxy_set_header x-payout-id        $http_x_payout_id;
    proxy_set_header x-beneficiary-ref  $http_x_beneficiary_ref;
    # Edge-asserted network hint → sourceHint evidence (never client-writable)
    proxy_set_header x-forwarded-for    $proxy_add_x_forwarded_for;
    proxy_set_header user-agent         $http_user_agent;
    proxy_connect_timeout 0.25s;
    proxy_read_timeout 0.25s;                 # match Envoy's 0.25s budget
  }

  # Deny path: auth_request returns 403 upstream → nginx emits 403 to caller
  # automatically; the verdict headers are on the subrequest response.

  location /healthz { proxy_pass http://payout_api/healthz; }
}

