# Ship the PayRekha decision log + audit events to your SIEM.
# The gateway writes one JSON object per line to PAYREKHA_DECISION_LOG
# (default /var/lib/payrekha/decisions.jsonl). This config tails that file,
# parses each event, and forwards it — pick ONE sink below and uncomment.
#
#   docker run -d --name payrekha-siem \
#     -v /var/lib/payrekha:/var/lib/payrekha:ro \
#     -v $(pwd)/vector.toml:/etc/vector/vector.toml:ro \
#     timberio/vector:0.42.X-alpine
#
# Fields per line (types.ts → DecisionRecord): ts, payoutId, kind, sourceKeyId,
# merchantId, amountPaise, channel, origin, verdict, effectiveAction, mode,
# riskScore, rules[], intentId, dedupe, degraded. Raw beneficiary identifiers
# are never present — only h:v1: hashes — so forwarding is DPDP-safe.
# Audit events (mode changes, canary registration, issuer revocation, outcome
# releases) appear in the same stream with type:"audit".
# Prefer CEF? Set PAYREKHA_LOG_FORMAT=cef on the gateway — decision lines ship
# as CEF:0 while audit lines stay JSON; tail this file with a plain file
# source and no parse transform.

[sources.decision_log]
type = "file"
include = ["/var/lib/payrekha/decisions.jsonl"]
read_from = "end"           # change to "beginning" once to backfill
fingerprint.strategy = "checksum"
fingerprint.bytes = 256

[transforms.parse]
type = "remap"
inputs = ["decision_log"]
source = '''
  . = parse_json!(.message)
  .collector = "payrekha"
'''

