{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.secretStoreRef.name }}{{ fail "externalSecrets.enabled needs secretStoreRef.name" }}{{ end }}
{{- if and (not .Values.externalSecrets.dataFrom) (not .Values.externalSecrets.data) }}{{ fail "externalSecrets needs dataFrom or data — nothing else knows which remote keys map to PAYREKHA_* envs" }}{{ end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "payrekha.fullname" . }}
  labels: {{- include "payrekha.labels" . | nindent 4 }}
spec:
  # Materialises `.Values.existingSecret` — the pods consume it via envFrom
  # exactly as if you had kubectl-created it.
  target:
    name: {{ required "existingSecret is required" .Values.existingSecret }}
    creationPolicy: Owner
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  {{- with .Values.externalSecrets.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecrets.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
