{{- if not (has .Values.topology (list "single" "activeActive")) }}{{ fail "topology must be single or activeActive" }}{{ end }}
{{- if not (has .Values.state.type (list "file" "postgres")) }}{{ fail "state.type must be file or postgres" }}{{ end }}
{{- if and (eq .Values.topology "single") (gt (int .Values.replicaCount) 1) }}{{ fail "topology=single needs replicaCount=1 — a second writer CAS-fences itself; for HA use standby.enabled or topology=activeActive" }}{{ end }}
{{- if eq .Values.topology "activeActive" }}
{{- if lt (int .Values.replicaCount) 2 }}{{ fail "topology=activeActive needs replicaCount>=2 — use topology=single for one writer" }}{{ end }}
{{- if ne .Values.state.type "postgres" }}{{ fail "topology=activeActive needs state.type=postgres (shared control row + snapshot CAS)" }}{{ end }}
{{- if not (hasKey (.Values.config.gateway | default dict) "sharedState") }}{{ fail "topology=activeActive needs config.gateway.sharedState set — every replica must commit through the shared store (ADR 0004)" }}{{ end }}
{{- end }}
{{- if and .Values.standby.enabled (ne .Values.topology "single") }}{{ fail "standby.enabled only applies to topology=single — activeActive replicas already serve" }}{{ end }}
{{ include "payrekha.deployment" (dict "root" . "component" "primary" "replicas" .Values.replicaCount) }}
{{- if .Values.standby.enabled }}
---
{{ include "payrekha.deployment" (dict "root" . "component" "standby" "replicas" .Values.standby.replicas) }}
{{- end }}
