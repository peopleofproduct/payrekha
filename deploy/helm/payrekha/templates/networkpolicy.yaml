{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "payrekha.fullname" . }}
  labels: {{- include "payrekha.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "payrekha.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {{- toYaml .Values.networkPolicy.clientPodSelector | nindent 12 }}
        - namespaceSelector: {{- toYaml .Values.networkPolicy.prometheusNamespaceSelector | nindent 12 }}
      ports: [{ port: 8080, protocol: TCP }]
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
