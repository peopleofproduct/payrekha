# Envoy in front of an existing payout API. Every POST /payouts is sent to
# PayRekha's ext_authz adapter (with the body) before it reaches upstream.
# Shadow mode: PayRekha always answers 200 and only logs. Enforce: 403 stops it.
static_resources:
  listeners:
    - name: payouts
      address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: payouts
                route_config:
                  virtual_hosts:
                    - name: payouts
                      domains: ['*']
                      routes:
                        - match: { prefix: '/payouts' }
                          route: { cluster: payout_api }
                          # ADR 0004 Phase 1: heuristic state is per-replica.
                          # Hash by the asserted sourceKeyId so one caller keeps
                          # one evaluator (and one payout-api pod) — budgets
                          # don't multiply across replicas. Swap the header for
                          # however your deployment asserts caller identity.
                          hash_policy:
                            - header: { header_name: x-client-id }
                        - match: { prefix: '/' }
                          route: { cluster: payout_api }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # PayRekha unreachable → deny. Pair with a client-side hold-above fail mode if you prefer.
                      failure_mode_allow: false
                      with_request_body: { max_request_bytes: 65536, allow_partial_message: false }
                      http_service:
                        server_uri: { uri: payrekha:8080, cluster: payrekha, timeout: 0.25s }
                        path_prefix: /ext_authz
                        authorization_request:
                          # Only fields PayRekha maps. Note what is NOT here:
                          # x-client-id — the caller must never name its own
                          # source key. Envoy asserts the identity below; in
                          # production inject it per-route or from mTLS/JWT
                          # claims, never forward a client-supplied value.
                          allowed_headers:
                            patterns:
                              - { exact: x-payrekha-intent }
                              - { exact: x-payout-kind }
                              - { exact: x-request-id }
                              # Envoy-computed XFF → sourceHint (identity.fingerprint evidence)
                              - { exact: x-forwarded-for }
                          headers_to_add:
                            - { key: x-payrekha-key, value: demo-ext-authz-key-0123 }
                            - { key: x-client-id, value: demo-payout-api }
                            # Trusted identity asserted BY Envoy: it lands in
                            # the check request, unlike route-level
                            # request_headers_to_add which only reaches the
                            # upstream. Per-route origin needs a per-route
                            # ext_authz check_settings override.
                            - { key: x-payrekha-origin, value: prod }
                        authorization_response:
                          allowed_upstream_headers:
                            patterns: [{ prefix: x-payrekha- }]
                          allowed_client_headers:
                            patterns: [{ prefix: x-payrekha- }]
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: payrekha
      type: STRICT_DNS
      connect_timeout: 0.25s
      # RING_HASH honours the route's hash_policy (x-client-id above) so the
      # ext_authz hop lands on the same payrekha replica per caller key.
      lb_policy: RING_HASH
      load_assignment:
        cluster_name: payrekha
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: payrekha, port_value: 8080 } } } }] }]
    - name: payout_api
      type: STRICT_DNS
      connect_timeout: 0.25s
      lb_policy: RING_HASH
      load_assignment:
        cluster_name: payout_api
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: payout-api, port_value: 9000 } } } }] }]
